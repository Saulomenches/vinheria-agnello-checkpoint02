<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="../css/contato.css" />
  </head>
  <body>
    <section class="fundoContato">
      <img src="../assets/imgs/fundoContato.png" alt="" />

      <div class="campoCadastro">
        <h1>Cadastro</h1>

        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome:</label>
          <input type="text" id="nome" />

          <br /><br />

          <label for="sobrenome">Sobrenome:</label>
          <input type="text" id="sobrenome" />

          <br /><br />

          <label for="telefone">Telefone:</label>
          <input type="number" id="telefone" />

          <br /><br />

          <label for="email">Email:</label>
          <input type="email" id="email" />
        </fieldset>

        <br />

        <fieldset>
          <legend>Contato</legend>

          <label for="assunto">Assunto:</label>

          <select name="assunto" id="assunto">
            <option value="">Selecione uma opção</option>
            <option value="Vinhos">Informações sobre vinhos</option>
            <option value="Harmonização">Harmonização</option>
            <option value="Pedidos">Pedidos</option>
            <option value="Outros">Outros</option>
          </select>

          <br /><br />

          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem"></textarea>
        </fieldset>

        <br />

        <button class="botaoEnviar">Enviar</button>
        <a href="../../index.html">
          <button class="botaoVoltar">Voltar</button>
        </a>
      </div>
    </section>

    <footer class="rodapeVoltar">
      <a href="../../index.html">Voltar</a>
    </footer>
  </body>
</html>
